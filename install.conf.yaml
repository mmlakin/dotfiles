- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0700

- clean: ['~', '~/.config']

- create:
    - ~/src
    - ~/bin

- shell:
    - [git submodule update --init --recursive, Installing submodules]

# Homebrew. Both steps are idempotent. The PATH export covers the
# first run, before any zshrc has run brew shellenv. Homebrew refuses
# untrusted taps, so shellclear's tap is added and trusted first.
- shell:
    - command: >-
        [ -x /opt/homebrew/bin/brew ] || [ -x /usr/local/bin/brew ] ||
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      description: Bootstrapping Homebrew
      stdin: true
      stdout: true
      stderr: true
    - command: >-
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" &&
        brew tap rusty-ferris-club/tap &&
        brew trust --tap rusty-ferris-club/tap &&
        brew bundle install --file=Brewfile --no-upgrade
      description: Installing Brewfile
      stdin: true
      stdout: true
      stderr: true
